<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">

  <defs>

    
    <linearGradient id="rearFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173B69" />
      <stop offset="0.55" stop-color="#102A50" />
      <stop offset="1" stop-color="#091A33" />
    </linearGradient>

    
    <linearGradient id="frontFill" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#214F84" />
      <stop offset="0.48" stop-color="#173D6D" />
      <stop offset="1" stop-color="#0A2347" />
    </linearGradient>

    
    <linearGradient id="paperFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FBFF" />
      <stop offset="0.45" stop-color="#EAF1F8" />
      <stop offset="1" stop-color="#C9D9E8" />
    </linearGradient>

    
    <linearGradient id="cyanRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE" />
      <stop offset="0.48" stop-color="#38BDF8" />
      <stop offset="1" stop-color="#2563EB" />
    </linearGradient>

    
    <linearGradient id="softHighlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="0.48" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.06" />
    </linearGradient>

    
    <filter id="edgeGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feFlood flood-color="#22D3EE" flood-opacity="0.32" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    
    <filter id="groundShadow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="5" />
    </filter>

  </defs>

  
  <ellipse cx="128" cy="220" rx="89" ry="10" fill="#000000" opacity="0.34" filter="url(#groundShadow)" />

  
